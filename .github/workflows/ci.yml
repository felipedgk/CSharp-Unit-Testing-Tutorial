name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore src/UnitTestingTutorial.slnx
      - run: dotnet build src/UnitTestingTutorial.slnx --no-restore --configuration Release
      - run: dotnet test src/UnitTestingTutorial.slnx --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura-cobertura-xml
          path: ./TestResults/**/coverage.cobertura.xml
